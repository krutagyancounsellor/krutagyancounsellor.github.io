baseURL: https://krutagyancounsellor.github.io/
# RFC 5646 language tag. Used by `language.Translate`, date/currency/number
# localisation, and by the templates for `<html lang>`, the RSS `<language>`
# element and `og:locale`. Requires Hugo 0.158+ (replaced `languageCode`).
locale: en-in
defaultContentLanguage: en
# ---------------------------------------------------------------------------
# Languages. A single language today; the block exists so that adding a second
# language later is a matter of adding an entry here plus `i18n/<lang>.toml`
# (and, if needed, `content/<lang>/`). All UI strings already live in
# `i18n/en.toml` and are referenced with `i18n`/`T`, so no template changes
# are required to translate.
# ---------------------------------------------------------------------------
languages:
  en:
    label: English
    locale: en-IN
    weight: 1

title: Krutagyan Counsellor
enableRobotsTXT: true

# ---------------------------------------------------------------------------
# Git integration.
#
# `enableGitInfo` makes Hugo read the git author date of each file's last
# revision. Combined with the `frontmatter.lastmod` list below, every page
# that has no explicit `lastmod:` in its front matter gets a *real* "last
# updated" timestamp taken from the commit that last touched it — instead of
# the hard-coded scaffold dates that previously appeared on every URL in
# sitemap.xml.
#
# `timeZone` makes undated / date-only values resolve to +05:30 (IST) so the
# sitemap, RSS and JSON-LD timestamps are consistent with the site's locale.
#
# NOTE: this requires the *full* git history to be available at build time.
# The GitHub Actions workflow therefore checks out with `fetch-depth: 0`.
# If history is missing, Hugo silently falls back to the `date` field.
# ---------------------------------------------------------------------------
enableGitInfo: true
timeZone: Asia/Kolkata

frontmatter:
  # `lastmod` is listed first so an explicit `lastmod:` in a content file
  # always wins (used for the legal pages, whose review date is meaningful
  # and must not drift to an unrelated commit date). Everything else falls
  # back to the git author date.
  lastmod:
    - lastmod
    - :git
    - modified
    - date
    - publishdate
    - pubdate
    - published

# ---------------------------------------------------------------------------
# Site-wide parameters. These are the single source of truth for every
# contact detail, social profile and SEO default used across the templates.
# ---------------------------------------------------------------------------
params:
  description: Online, person-centred counselling for life transitions, changing roles, relationships and self-understanding. Explore your experiences in the context of family, culture and personal beliefs.
  author: Madhuchhanda
  authorFullName: Madhuchhanda Padhy
  email: krutagyancounsellor@gmail.com
  phone: "+91 96328 71524"
  # Digits only (no spaces, dashes or "+") — required by the wa.me API.
  whatsapp: "919632871524"
  whatsappText: "Hi, I'd like to book a counselling session."
  twitter: "@krutagyanc"
  # Brand suffix appended to every page <title>. Kept separate from the
  # top-level `title` (which is the spaced, human-facing brand used in the
  # footer, og:site_name and structured data) so the suffix can use the
  # no-space spelling.
  titleSuffix: "KrutagyanCounsellor"
  # Shown in the homepage <title> — keyword-rich, under ~60 characters.
  # The brand suffix is appended automatically, so do not repeat it here.
  homeTitle: "Online Counselling for Life Identity & Transitions"
  bookingURL: https://wa.me/919632871524?text=Hi%2C%20I%27d%20like%20to%20book%20a%20counselling%20session.

  # -------------------------------------------------------------------------
  # LIMITED-TIME OFFER — removable in one step.
  # Set `enabled: false` to remove every offer line/sentence from the homepage
  # and revert all booking buttons to the "off" label. The labels and the
  # accompanying copy live in `i18n/en.toml` (see `[cta]` and `[offer]`), so
  # a future second language only needs a new translation file.
  # -------------------------------------------------------------------------
  offer:
    enabled: true

  # -------------------------------------------------------------------------
  # Session details shown in Section 6B. Kept in params so the fee, duration
  # and booking terms can be updated in one place.
  # -------------------------------------------------------------------------
  session:
    duration: "45 minutes - 90 minutes"
    fee: "₹800 to ₹2,000, on a sliding scale."
    complimentary: "30 minutes, available until 31 January 2027."
    booking: "Advance booking is required. Appointment times are subject to availability."
    mode: "All sessions are conducted online, so you can attend from wherever you are."

  # -------------------------------------------------------------------------
  # Instagram — the primary channel for reflections, client experiences and
  # current offers. Kept as a dedicated block (rather than only an entry in
  # `socials`) so the hero CTA, the footer icon and the structured data all
  # resolve to the same URL. `verify-seo.js` asserts they stay in sync.
  # -------------------------------------------------------------------------
  instagram:
    handle: "@krutagyancounsellor"
    url: https://www.instagram.com/krutagyancounsellor/

  socials:
    - name: Facebook
      icon: bi-facebook
      url: https://www.facebook.com/krutagyancounsellor
    - name: LinkedIn
      icon: bi-linkedin
      url: https://www.linkedin.com/in/madhuchhanda-padhy-61944a320
    - name: Twitter
      icon: bi-twitter-x
      url: https://x.com/krutagyanc

pagination:
  pagerSize: 6

permalinks:
  # `:contentbasename` keeps the short, stable URLs derived from each Markdown
  # file name (e.g. /blog/anxiety-grounding/). Using `:slug` would instead
  # derive the URL from the page *title*, producing very long URLs.
  blog: /blog/:contentbasename/

taxonomies:
  tag: tags
  category: categories

sitemap:
  changefreq: weekly
  filename: sitemap.xml
  priority: 0.5

minify:
  minifyOutput: true

module:
  mounts:
    - source: assets
      target: assets
    - source: node_modules
      target: assets/node_modules

menu:
  main:
    - name: "Home"
      url: "/"
      weight: 1
    - name: "Blog"
      url: "/blog/"
      weight: 2
  footer:
    - name: "Terms & Conditions"
      url: "/terms-and-conditions/"
      weight: 1
    - name: "Privacy Policy"
      url: "/privacy-policy/"
      weight: 2



