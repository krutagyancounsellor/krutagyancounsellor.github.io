{{ define "main" }}

<div class="container py-4">
  {{ partial "breadcrumbs.html" . }}

  <h1 class="mb-4">{{ .Title }}</h1>

  <ul class="list-unstyled">
    {{ range .Data.Terms }}

    <li class="mb-2">
      <a href="{{ .Page.RelPermalink }}"> {{ .Page.Title }} </a>

      <span class="text-muted">({{ .Count }})</span>
    </li>

    {{ end }}
  </ul>
</div>

{{ end }}
