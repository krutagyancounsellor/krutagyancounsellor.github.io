{{ define "main" }}

<div class="container py-4">
  {{ partial "breadcrumbs.html" . }}

  <h1 class="mb-4">Articles tagged "{{ .Title }}"</h1>

  {{ range .Pages }}

  <article class="mb-4">
    <h2>
      <a href="{{ .RelPermalink }}"> {{ .Title }} </a>
    </h2>

    <p class="text-muted">{{ .Date.Format "Jan 2, 2006" }}</p>

    <p>{{ .Summary }}</p>
  </article>

  {{ end }}
</div>

{{ end }}
