<nav
  class="navbar navbar-expand-lg navbar-light bg-light sticky-header"
  aria-label="Main navigation"
>
  <div class="container">
    <a class="navbar-brand" href="/">
      <img
        src="/logo-m.webp"
        alt="{{ .Site.Title }} home"
        height="64"
      />
    </a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbar"
      aria-controls="navbar"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbar">
      <ul class="navbar-nav ms-auto">
        {{ range .Site.Menus.main }}
        <li class="nav-item">
          <a class="nav-link" href="{{ .URL | relURL }}">{{ .Name }}</a>
        </li>
        {{ end }}
      </ul>
    </div>

    <!-- Booking CTA: offer-aware pill button. The label comes from
         `partials/offer-label.html`, so it matches every other CTA on the
         site and switches with `params.offer.enabled`. -->
    <div class="mt-2 mt-lg-0">
      {{ partial "booking-cta.html" (dict "context" . "class" "header-book-btn rounded-pill") }}
    </div>
  </div>
</nav>
